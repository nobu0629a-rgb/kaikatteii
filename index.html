<!DOCTYPE html>

<html lang="ja">


<meta name="viewport" content="width=device-width,initial-scale=1">

<title>買っていい？AI</title>

</head>

<body>

<h1>🛒 買っていい？AI</h1><p>その買い物、本当に買っていい？</p>

<label>何を買いたい？</label>

<input id="item" placeholder="例：ヘッドホン">

<label>値段はいくら？</label>

<input id="price" type="number" placeholder="30000">

<label>なぜ欲しい？</label>

<textarea id="reason"></textarea>

<button onclick="judge()">買っていい？判定する</button><div id="result"></div>

<script>

function judge(){

var p=Number(document.getElementById("price").value);

var r=document.getElementById("result");

if(!p){r.innerHTML="金額を入力してね";return;}

r.innerHTML=p<=5000?"🟢 買ってOK！":"🟡 ちょっと考えよう！";

}

</script>

</body>

</html>
